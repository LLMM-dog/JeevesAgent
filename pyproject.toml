[project]
name = "jeeves"
version = "0.1.0"
description = "本地个人 Agent 工作台"
license = { text = "MIT" }
requires-python = ">=3.11"

# 直接依赖钉精确版本。个人项目最怕"上周还能跑，今天装完就挂了" ——
# 范围版本下 uv sync 在新机器上会拉到更新的依赖，而这个更新可能有破坏性变更
# （LangGraph 在 0.2.x 内就改过 API）。配合提交 uv.lock 双重保险。
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.37",
    "aiosqlite==0.20.0",
    "alembic==1.14.0",
    "langgraph==0.2.62",
    "langchain-core==0.3.29",
    "httpx==0.28.1",
    "tiktoken==0.8.0",
    "cryptography==44.0.0",
    "structlog==24.4.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
# 可选功能未装时必须明确报错，不静默降级。见 docs/05-dev/setup.md
docker = ["docker==7.1.0"]
# 1.9.4 而非 2.0.0：后者要求 pydantic>=2.12 并换用 httpx2，与本项目的
# pydantic 2.10.5 / httpx 0.28.1 冲突。1.9.4 只要求 pydantic>=2.7.2、httpx>=0.27。
mcp = ["mcp==1.9.4"]
# ddgs 免费无 key，让联网搜索开箱可用；tavily 有 key 时结果质量更好
# （它的 snippet 是为 LLM 优化过的）。两者都装不上时 web_search 不注册。
search = ["tavily-python==0.5.0", "ddgs==9.14.4"]
# 定时任务。只用它算"下一个/上一个触发时间"，调度逻辑自己写 ——
# APScheduler 自带 job store + executor 模型，与本项目已有的
# "数据库为准 + asyncio task" 结构重叠，接进来反而要写适配层。
# tzdata 是 Windows 上的【必需依赖】而不是可选：
# Windows 没有系统 tz 数据库，ZoneInfo("Asia/Shanghai") 会抛
# ZoneInfoNotFoundError —— 而我的 get_tz 会静默回落本地时区，
# 于是所有时区都变成同一个，DST 测试全部假通过。
cron = ["croniter==6.2.4", "tzdata==2026.2; sys_platform == 'win32'"]
# readability-lxml 是正文提取的核心：先用它找出正文区域再转 Markdown，
# 否则导航栏/侧边栏/页脚/Cookie 提示全进上下文（一个新闻页可能 80% 是噪声）。
web = [
    "markdownify==0.14.1",
    "beautifulsoup4==4.12.3",
    "readability-lxml==0.8.4.1",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.2",
    "mypy==1.14.1",
    # yaml 的类型存根。不装的话 mypy 报 "Library stubs not installed"，
    # 而那条错误看起来像缺依赖，其实只是缺类型信息
    "types-PyYAML==6.0.12.20250822",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
# 120 而非 88：SQLAlchemy 的列定义和 FastAPI 的依赖注入天然长，
# 88 会把它们折成难读的多行。
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# ASYNC 规则组能抓到"在 async 函数里调了阻塞 I/O"
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 迁移文件由 autogenerate 产出，格式不受我们控制
"backend/migrations/*" = ["E", "F", "N", "I", "W"]
# B008 禁止在参数默认值里调用函数，但 FastAPI 的 Depends() 就是这个模式。
# 这是框架惯例而非缺陷，只在路由层豁免。
"backend/app/api/*" = ["B008"]
"backend/app/modules/agent/agent_router.py" = ["B008"]
# 测试里访问被测模块的私有函数是正常的
"backend/tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "mcp.*", "docker.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 不设会有 PytestDeprecationWarning，且未来版本默认值会变
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["error::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
