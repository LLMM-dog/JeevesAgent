# 用户画像 —— 唯一的全局记忆。
#
# 所有智能体共享一份。理由见 docs/architecture/memory.md#为什么用户画像是全局的其它都不是：
# 用户只有一个，让每个智能体各自积累一份等于重复劳动，而且会各自跑偏。

memory_type: profile
scope: global
directory: ""
filename_template: "profile.md"
operation_mode: upsert
peer_enabled: false

description: |
  用户画像。记录"用户是个什么样的人"这一层的稳定属性。

  该记：
  - 职业、经验水平、技术背景
  - 主力技术栈与工具链
  - 沟通风格（喜欢简短还是详尽、能否接受直接的反对意见）
  - 工作习惯（何时工作、如何组织项目）

  不该记：
  - 具体事件（那是 events）
  - 临时状态和情绪
  - 只由助手说出、用户没确认的推断
  - 一次性的问题排查过程

  规则：
  - 每条是一个自包含的陈述句，30 字以内
  - 只记用户明确说过或确认过的事实，不猜
  - 可变的状态必须带时间标注：`（截至 2026-08）`
  - 有冲突时保留最新的那条，删掉旧的

fields:
  - name: content
    type: string
    merge_op: patch
    init_value: |
      # 用户

      （待从对话中学习）
    description: |
      用户画像正文。Markdown 格式：一个 H1 写用户称呼，然后只用无序列表，不写段落。

      示例：
      # LLMM-dog
      - 职业：个人开发者
      - 主力技术栈：Python（FastAPI / SQLAlchemy / pytest）
      - 代码风格：ruff，行长 120（截至 2026-08）
      - 沟通偏好：接受直接的反对意见，讨厌无根据的附和
      - 工作习惯：先写文档再写代码

      【重要】可变状态必须带 `（截至 YYYY-MM）` 标注 —— 半年后看到这条时
      要能判断它是否已过时，而不是当成永恒事实。
